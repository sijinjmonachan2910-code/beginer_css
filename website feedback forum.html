<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Feedback Form</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-4 text-center">Website Feedback Form</h3>

            <form action="#" method="post">
              
              <!-- Name -->
              <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Your full name" required>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="your.email@example.com" required>
              </div>

              <!-- Feedback -->
              <div class="mb-3">
                <label for="feedback" class="form-label">Feedback</label>
                <textarea class="form-control" id="feedback" name="feedback" rows="4" placeholder="Write your feedback here..." required></textarea>
              </div>

              <!-- How did you find the site -->
              <div class="mb-3">
                <label for="source" class="form-label">How did you find our site?</label>
                <select class="form-select" id="source" name="source" required>
                  <option value="">-- Please select --</option>
                  <option value="search_engine">Search Engine</option>
                  <option value="social_media">Social Media</option>
                  <option value="friend">Friend/Family</option>
                  <option value="advertisement">Advertisement</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <!-- Satisfaction Level -->
              <div class="mb-3">
                <label class="form-label">Satisfaction Level</label>
                <div class="d-flex gap-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction1" value="1" required>
                    <label class="form-check-label" for="satisfaction1">1</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction2" value="2">
                    <label class="form-check-label" for="satisfaction2">2</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction3" value="3">
                    <label class="form-check-label" for="satisfaction3">3</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction4" value="4">
                    <label class="form-check-label" for="satisfaction4">4</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="satisfaction" id="satisfaction5" value="5">
                    <label class="form-check-label" for="satisfaction5">5</label>
                  </div>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg">Submit Feedback</button>
              </div>

            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (with Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
