<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
      width: 100%;
      border-collapse: collapse;
    }
    table, th, td {
      border: 2px solid #555;
    }
    th, td {
      background-color: #808080;
      color: #ffffff;
      padding: 12px 18px;
      text-align: left;
    }
    th {
      background-color: #5a5a5a;
      font-weight: 700;
    }
    </style>
</head>
<body>
    <table>
      <thead>
        <tr>
          <th>Id</th>
          <th>Product Name</th>
          <th>Product Price</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Wireless Mouse</td><td>$25.99</td></tr>
        <tr><td>2</td><td>Mechanical Keyboard</td><td>$79.00</td></tr>
        <tr><td>3</td><td>USB-C Hub</td><td>$34.50</td></tr>
        <tr><td>4</td><td>Monitor Stand</td><td>$49.99</td></tr>
        <tr><td>5</td><td>Webcam HD</td><td>$59.00</td></tr>
      </tbody>
    </table>
</body>
</html>
