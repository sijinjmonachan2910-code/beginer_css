<!DOCTYPE html>
<html>
<head>
    <title>Game Result Generator</title>
</head>
<body>

<h2>Game Result Generator</h2>

<p id="mystery"></p>
<p id="score"></p>
<p id="difference"></p>
<p id="sqrt"></p>
<p id="pi"></p>
<p id="implicit"></p>
<p id="max"></p>
<p id="min"></p>

<script>
// Step 1: Random number (1–50)
let mysteryLevel = Math.floor(Math.random() * 50) + 1;

// Step 2: User score as string
let userScoreStr = "45";

// Step 3: Convert to number
let userScore = Number(userScoreStr);

// Step 4: Absolute difference
let difference = Math.abs(mysteryLevel - userScore);

// Step 5: Square root
let sqrtValue = Math.sqrt(userScore);

// Step 6: PI value
let piValue = Math.PI;

// Step 7: Implicit conversion
let implicitResult = "20" * 5;

// Step 8: Max and Min
let maxValue = Math.max(10, 20, mysteryLevel);
let minValue = Math.min(10, 20, mysteryLevel);

// Display results
document.getElementById("mystery").innerHTML = "Mystery Level: " + mysteryLevel;
document.getElementById("score").innerHTML = "User Score: " + userScore;
document.getElementById("difference").innerHTML = "Absolute Difference: " + difference;
document.getElementById("sqrt").innerHTML = "Square Root of Score: " + sqrtValue;
document.getElementById("pi").innerHTML = "Value of PI: " + piValue;
document.getElementById("implicit").innerHTML = 'Implicit ("20" * 5): ' + implicitResult;
document.getElementById("max").innerHTML = "Maximum (10, 20, mystery): " + maxValue;
document.getElementById("min").innerHTML = "Minimum (10, 20, mystery): " + minValue;

</script>

</body>
</html>
