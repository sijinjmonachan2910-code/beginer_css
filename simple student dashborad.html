<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Dashboard</a></li>
        <li class="breadcrumb-item active" aria-current="page">My Courses</li>
      </ol>
    </nav>

    <!-- Start New Course Button -->
    <button class="btn btn-outline-primary btn-md mb-4">Start New Course</button>

    <!-- My Progress Heading with Badge -->
    <h4>
      My Progress <span class="badge bg-secondary">3 Courses</span>
    </h4>

    <!-- Progress Bar -->
    <div class="progress my-3" style="height: 25px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
           role="progressbar" style="width: 70%;" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100">
        70%
      </div>
    </div>

    <!-- Pagination -->
    <nav>
      <ul class="pagination">
        <li class="page-item"><a class="page-link" href="#">1</a></li>
        <li class="page-item active" aria-current="page"><span class="page-link">2</span></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
      </ul>
    </nav>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
