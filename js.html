
<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Math.sqrt()</h2>

<p>Math.sqrt(x) returns the square root of x:</p>

<p id="demo"></p>

<p id="demo1"></p>

<script>
document.getElementById("demo").innerHTML = Math.sqrt(Math.sqrt(81) * Math.sqrt(81) * Math.sqrt(81));
document.getElementById("demo1").innerHTML = Math.sqrt(27 ** 1/3);
</script>

</body>
</html>
