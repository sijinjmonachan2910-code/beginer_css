<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn-link {
      display: inline-block;
      background-color: #e8001c;
      color: #fff;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: opacity 0.25s ease;
      opacity: 1;
    }
    .btn-link:hover {
      opacity: 0.65;
    }
    </style>
</head>
<body>
    <a href="#" class="btn-link">Click Here</a>
</body>
</html>
